<div class="min-h-screen bg-slate-100 flex flex-col items-center justify-center gap-6 p-8">
  <div class="bg-white shadow-md rounded-lg p-8 max-w-md w-full border-t-4 border-blue-800">
    <h1 class="text-2xl font-bold text-blue-900">{{ title() }}</h1>
    <p class="text-slate-600 mt-1">Sistema de Informação do PAT Jacareí</p>

    <div class="mt-6 flex items-center gap-3">
      <span
        class="h-3 w-3 rounded-full"
        [class.bg-green-500]="connectionStatus() === 'ok'"
        [class.bg-yellow-400]="connectionStatus() === 'checking'"
        [class.bg-red-500]="connectionStatus() === 'error'"
      ></span>

      @switch (connectionStatus()) {
        @case ('checking') {
          <span class="text-slate-600 text-sm">Verificando conexão com a API…</span>
        }
        @case ('ok') {
          <span class="text-green-700 text-sm font-medium">API e banco de dados conectados</span>
        }
        @case ('error') {
          <span class="text-red-700 text-sm font-medium">Não foi possível conectar à API</span>
        }
      }
    </div>
  </div>

  <router-outlet />
</div>
